<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ThreadLight Components</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #121110;
      color: #fbf2e3;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 128, 33, .14), transparent 34rem),
        radial-gradient(circle at 85% 85%, rgba(255, 168, 61, .07), transparent 32rem),
        #121110;
    }
    main {
      position: relative;
      overflow: hidden;
      width: min(680px, 100%);
      padding: clamp(28px, 6vw, 52px);
      border: 1px solid rgba(255, 148, 46, .22);
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(46, 42, 38, .97), rgba(24, 23, 21, .98));
      box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
    }
    main::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: #ff8021;
      content: "";
    }
    .eyebrow {
      color: #ffa83d;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: .76rem;
    }
    h1 {
      margin: 10px 0 12px;
      font-size: clamp(2rem, 7vw, 3.5rem);
      line-height: 1.02;
      letter-spacing: -.04em;
    }
    p {
      margin: 0 0 28px;
      color: #d5c7b5;
      font-size: 1.05rem;
      line-height: 1.65;
    }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border: 1px solid rgba(255, 148, 46, .68);
      border-radius: 8px;
      background: linear-gradient(90deg, #9e400f, #2e170d);
      color: #fbf2e3;
      font-weight: 800;
      text-decoration: none;
      box-shadow:
        inset 0 1px rgba(255, 255, 255, .06),
        0 8px 22px rgba(0, 0, 0, .28);
      transition: border-color .16s ease, box-shadow .16s ease, filter .16s ease, transform .16s ease;
    }
    a.button:hover,
    a.button:focus-visible {
      border-color: #ffa83d;
      filter: brightness(1.14);
      box-shadow:
        inset 0 1px rgba(255, 255, 255, .08),
        0 0 0 2px rgba(255, 128, 33, .15),
        0 10px 26px rgba(0, 0, 0, .32);
      outline: none;
      transform: translateY(-1px);
    }
    a.button:active {
      filter: brightness(.98);
      transform: translateY(0);
    }
    .note {
      margin-top: 18px;
      color: #9e9385;
      font-size: .86rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">ThreadLight</div>
    <h1>Components</h1>
    <p>Lightweight customer support components for prefabs created with Threadlight.</p>
    <a class="button" id="add-to-vcc" href="./?install=1" target="_blank" rel="noopener">Add to VCC</a>
    <div class="note">Requires VRChat Creator Companion on this computer.</div>
  </main>
  <script>
    const vccUrl = "vcc://vpm/addRepo?url=https%3A%2F%2Fwolfy527.github.io%2Fthreadlight-components%2Findex.json";
    const installRequested = new URLSearchParams(window.location.search).get("install") === "1";

    if (installRequested) {
      const button = document.getElementById("add-to-vcc");
      button.href = vccUrl;
      button.removeAttribute("target");
      button.removeAttribute("rel");
      button.textContent = "Open VCC";
      window.location.assign(vccUrl);
    }
  </script>
</body>
</html>
