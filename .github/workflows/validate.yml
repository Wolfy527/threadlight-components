name: Validate Package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package
        uses: actions/checkout@v6

      - name: Validate manifest and Unity metadata
        shell: pwsh
        run: ./.github/scripts/validate-package.ps1 -PackageRoot . -ExpectedName "com.wolfyvr.threadlight.components"

      - name: Build fallback installer
        shell: pwsh
        run: ./.github/scripts/build-fallback-installer.ps1 -PackageRoot . -OutputDirectory "${{ runner.temp }}/fallback"

      - name: Compile fallback bootstrap
        shell: pwsh
        run: ./.github/scripts/test-fallback-bootstrap.ps1 -PackageRoot .
